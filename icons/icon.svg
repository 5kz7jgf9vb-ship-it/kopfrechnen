<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Kopfrechnen-Icon: Glasfläche mit den vier Rechenzeichen auf tiefem Verlauf.
       Alle Formen liegen innerhalb der Maskable-Safe-Zone (80 %-Kreis). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1a4a"/>
      <stop offset="0.55" stop-color="#26207a"/>
      <stop offset="1" stop-color="#4a1f86"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#3d8bff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#3d8bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.95" r="0.65">
      <stop offset="0" stop-color="#c04cff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#c04cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.25" cy="0" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#05061a" flood-opacity="0.55"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0a0b2a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glowA)"/>
  <rect width="1024" height="1024" fill="url(#glowB)"/>

  <!-- Glasfläche -->
  <g filter="url(#shadow)">
    <rect x="212" y="212" width="600" height="600" rx="160" fill="url(#glass)"/>
  </g>
  <rect x="212" y="212" width="600" height="600" rx="160" fill="url(#shine)"/>
  <rect x="213.5" y="213.5" width="597" height="597" rx="158.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- Rechenzeichen -->
  <g filter="url(#soft)" stroke="#ffffff" stroke-width="46" stroke-linecap="round" fill="none">
    <path d="M297 367h140M367 297v140"/>
    <path d="M587 367h140" stroke="#bfe0ff"/>
    <path d="M317 607l100 100M417 607l-100 100" stroke="#bfe0ff"/>
    <path d="M587 657h140"/>
  </g>
  <g filter="url(#soft)" fill="#ffffff">
    <circle cx="657" cy="590" r="26"/>
    <circle cx="657" cy="724" r="26"/>
  </g>
</svg>
